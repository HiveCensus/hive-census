
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Hive Keychain — Signature Diagnostics</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #101827;
      color: #edf2f7;
    }

    main {
      max-width: 640px;
      margin: 24px auto;
    }

    h1 {
      font-size: 1.6rem;
    }

    h2 {
      font-size: 1.2rem;
    }

    p {
      line-height: 1.6;
      color: #b8c5d6;
    }

    .panel {
      margin-top: 20px;
      padding: 20px;
      background: #1c293b;
      border: 1px solid #34465e;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #40536b;
      border-radius: 8px;
      background: #101827;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #e44d51;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    button.secondary {
      background: #40536b;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 14px;
      background: #0b1422;
      border-radius: 8px;
      font-size: .85rem;
      line-height: 1.5;
    }

    .success {
      color: #9ce6ba;
    }

    .error {
      color: #ff9c9c;
    }

    .muted {
      color: #b8c5d6;
    }
  </style>
</head>

<body>
  <main>
    <h1>Hive Keychain — Signature Diagnostics</h1>

    <p>
      Diagnostic tool for comparing a standard
      Keychain signature with a real Hive Census
      administrator authentication challenge.
    </p>

    <section class="panel">
      <h2>Environment</h2>
      <pre id="environment">Checking...</pre>
    </section>

    <section class="panel">
      <h2>Test configuration</h2>

      <label for="account">
        Hive account
      </label>

      <input
        id="account"
        type="text"
        value="jocieprosza"
        autocomplete="off"
        spellcheck="false"
      >

      <label for="keyType">
        Key type
      </label>

      <select id="keyType">
        <option value="Posting">Posting</option>
        <option value="Active">Active</option>
        <option value="Memo">Memo</option>
      </select>

      <label for="message">
        Test message
      </label>

      <textarea id="message">Hive Census Keychain diagnostic test</textarea>

      <button id="standardButton">
        Test 1 — Sign standard message
      </button>

      <button id="challengeButton">
        Test 2 — Sign real admin challenge
      </button>

      <button
        id="resetButton"
        class="secondary"
      >
        Reset diagnostics
      </button>
    </section>

    <section class="panel">
      <h2>Test status</h2>
      <pre id="status">Ready.</pre>

      <h2>Keychain response</h2>
      <pre id="result">No response yet.</pre>

      <h2>Event log</h2>
      <pre id="log">Waiting for test.</pre>

      <button
        id="copyButton"
        class="secondary"
      >
        Copy diagnostic log
      </button>
    </section>
  </main>

  <script>
    "use strict";

    const ADMIN_ACCOUNT = "jocieprosza";

    const accountInput =
      document.getElementById("account");

    const keyTypeInput =
      document.getElementById("keyType");

    const messageInput =
      document.getElementById("message");

    const standardButton =
      document.getElementById("standardButton");

    const challengeButton =
      document.getElementById("challengeButton");

    const resetButton =
      document.getElementById("resetButton");

    const copyButton =
      document.getElementById("copyButton");

    const environment =
      document.getElementById("environment");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");

    const log =
      document.getElementById("log");

    let startedAt = null;
    let activeTest = false;
    let events = [];
    let testSequence = 0;

    function timestamp() {
      return new Date().toISOString();
    }

    function elapsed() {
      if (startedAt === null) {
        return "0.0";
      }

      return (
        (performance.now() - startedAt) / 1000
      ).toFixed(2);
    }

    function addLog(text) {
      const entry =
        `[${timestamp()}] ` +
        `[+${elapsed()}s] ${text}`;

      events.push(entry);

      log.textContent = events.join("\n");

      console.log("[Keychain Test]", text);
    }

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = type;
    }

    function setBusy(value) {
      activeTest = value;

      standardButton.disabled = value;
      challengeButton.disabled = value;
      accountInput.disabled = value;
      keyTypeInput.disabled = value;
      messageInput.disabled = value;
    }

    function inspectEnvironment() {
      const keychain = window.hive_keychain;

      const data = {
        origin: location.origin,
        userAgent: navigator.userAgent,
        keychainDetected: Boolean(keychain),
        requestSignBufferAvailable:
          typeof keychain?.requestSignBuffer ===
          "function",
        requestHandshakeAvailable:
          typeof keychain?.requestHandshake ===
          "function"
      };

      environment.textContent =
        JSON.stringify(data, null, 2);

      return data;
    }

    function sanitizeResponse(response) {
      if (
        !response ||
        typeof response !== "object"
      ) {
        return {
          responseType: typeof response
        };
      }

      const sanitized = {
        success: response.success,
        error: response.error,
        message: response.message,
        request_id: response.request_id,
        resultType: typeof response.result
      };

      if (
        typeof response.result === "string"
      ) {
        sanitized.signatureLength =
          response.result.length;
      }

      return sanitized;
    }

    function beginTest(name) {
      if (activeTest) {
        return false;
      }

      testSequence++;
      startedAt = performance.now();
      events = [];

      log.textContent = "";
      result.textContent =
        "Waiting for test result...";

      setBusy(true);

      addLog(`Test started: ${name}`);

      return true;
    }

    function finishTest() {
      setBusy(false);
    }

    function getKeychain() {
      const keychain = window.hive_keychain;

      if (
        !keychain ||
        typeof keychain.requestSignBuffer !==
          "function"
      ) {
        throw new Error(
          "Hive Keychain signing API unavailable."
        );
      }

      return keychain;
    }

    function validateAccount(account) {
      if (
        !/^[a-z][a-z0-9.-]{2,15}$/.test(account)
      ) {
        throw new Error(
          "Invalid Hive account name."
        );
      }
    }

    function signMessage(
      account,
      messageText,
      keyType,
      sequence
    ) {
      return new Promise((resolve, reject) => {
        const keychain = getKeychain();

        let settled = false;

        const signatureStarted =
          performance.now();

        function finish(error, response) {
          if (settled) {
            return;
          }

          settled = true;

          if (error) {
            reject(error);
          } else {
            resolve(response);
          }
        }

        addLog(
          `Calling requestSignBuffer for @${account}`
        );

        addLog(`Key type: ${keyType}`);
        addLog(
          `Message length: ${messageText.length}`
        );

        setStatus(
          "Waiting for Keychain confirmation..."
        );

        try {
          keychain.requestSignBuffer(
            account,
            messageText,
            keyType,
            response => {
              if (sequence !== testSequence) {
                return;
              }

              const seconds = (
                (
                  performance.now() -
                  signatureStarted
                ) / 1000
              ).toFixed(2);

              addLog(
                `Keychain callback after ${seconds}s`
              );

              const sanitized =
                sanitizeResponse(response);

              result.textContent =
                JSON.stringify(
                  sanitized,
                  null,
                  2
                );

              addLog(
                "Keychain success: " +
                Boolean(response?.success)
              );

              if (response?.success === true) {
                finish(null, response);
              } else {
                finish(
                  new Error(
                    response?.message ||
                    response?.error ||
                    "Keychain rejected the request."
                  )
                );
              }
            }
          );

          addLog(
            "Request submitted; awaiting callback"
          );
        } catch (error) {
          finish(error);
        }
      });
    }

    async function runStandardTest() {
      if (!beginTest("Standard message")) {
        return;
      }

      const sequence = testSequence;

      try {
        const account =
          accountInput.value.trim()
            .replace(/^@/, "");

        const keyType = keyTypeInput.value;
        const messageText = messageInput.value;

        validateAccount(account);

        if (!messageText.trim()) {
          throw new Error(
            "Message cannot be empty."
          );
        }

        const response = await signMessage(
          account,
          messageText,
          keyType,
          sequence
        );

        if (response.success === true) {
          addLog("SUCCESS: standard signature");

          setStatus(
            `Standard message signed in ${elapsed()}s.`,
            "success"
          );
        }
      } catch (error) {
        addLog(
          "FAILURE: " + error.message
        );

        setStatus(
          `Standard test failed: ${error.message}`,
          "error"
        );
      } finally {
        finishTest();
      }
    }

    async function runChallengeTest() {
      if (!beginTest("Real admin challenge")) {
        return;
      }

      const sequence = testSequence;

      try {
        const account =
          accountInput.value.trim()
            .replace(/^@/, "");

        const keyType = keyTypeInput.value;

        validateAccount(account);

        if (account !== ADMIN_ACCOUNT) {
          throw new Error(
            "Admin challenge requires @jocieprosza."
          );
        }

        if (keyType !== "Posting") {
          throw new Error(
            "Admin challenge requires Posting key."
          );
        }

        addLog(
          "Fetching /api/admin/challenge"
        );

        setStatus(
          "Requesting real administrator challenge..."
        );

        const response = await fetch(
          "/api/admin/challenge",
          {
            method: "POST",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
              "Content-Type": "application/json"
            },
            body: "{}"
          }
        );

        addLog(
          `Challenge API HTTP ${response.status}`
        );

        const challenge = await response.json();

        if (
          !response.ok ||
          challenge.ok !== true
        ) {
          throw new Error(
            challenge.error ||
            `Challenge API HTTP ${response.status}`
          );
        }

        if (
          challenge.account !== ADMIN_ACCOUNT ||
          typeof challenge.nonce !== "string" ||
          typeof challenge.message !== "string"
        ) {
          throw new Error(
            "Invalid challenge structure."
          );
        }

        addLog(
          "Challenge received and validated"
        );

        addLog(
          `Challenge message length: ${challenge.message.length}`
        );

        /*
         * Sign exactly the server-provided
         * message, without changing its
         * whitespace, encoding or content.
         *
         * The challenge and signature are
         * deliberately not included in logs.
         */

        const signatureResponse =
          await signMessage(
            ADMIN_ACCOUNT,
            challenge.message,
            "Posting",
            sequence
          );

        if (signatureResponse.success === true) {
          addLog(
            "SUCCESS: real admin challenge signed"
          );

          addLog(
            "Signature not sent to login API"
          );

          setStatus(
            "Real administrator challenge signed " +
            `successfully in ${elapsed()}s.`,
            "success"
          );
        }
      } catch (error) {
        addLog(
          "FAILURE: " + error.message
        );

        setStatus(
          `Challenge test failed: ${error.message}`,
          "error"
        );
      } finally {
        finishTest();
      }
    }

    function resetTest() {
      if (activeTest) {
        addLog(
          "Reset requested while a Keychain " +
          "request may still be pending"
        );
      }

      testSequence++;
      events = [];
      startedAt = null;

      log.textContent =
        "Waiting for test.";

      result.textContent =
        "No response yet.";

      setStatus("Ready.");
      finishTest();

      inspectEnvironment();
    }

    async function copyLog() {
      const diagnostic = [
        "Hive Keychain Signature Diagnostic",
        "",
        "Environment:",
        environment.textContent,
        "",
        "Status:",
        status.textContent,
        "",
        "Response:",
        result.textContent,
        "",
        "Events:",
        events.join("\n")
      ].join("\n");

      try {
        await navigator.clipboard.writeText(
          diagnostic
        );

        addLog(
          "Diagnostic copied to clipboard"
        );
      } catch {
        addLog(
          "Clipboard unavailable; use screenshots"
        );
      }
    }

    standardButton.addEventListener(
      "click",
      runStandardTest
    );

    challengeButton.addEventListener(
      "click",
      runChallengeTest
    );

    resetButton.addEventListener(
      "click",
      resetTest
    );

    copyButton.addEventListener(
      "click",
      copyLog
    );

    inspectEnvironment();

    addLog("Diagnostic page loaded");
  </script>
</body>
</html>
